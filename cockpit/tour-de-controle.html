<title>Tour de contrôle J-Square</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Plan : une station par marché (France · QG · USA). Au centre le noyau cash, autour 8 salles reliées par des conduits où circulent les événements. */
:root{
  --bg:#ECEFF4;
  --floor:#E3E8F0;
  --grid:rgba(40,70,160,.075);
  --surface:#FFFFFF;
  --surface-2:#F4F6FA;
  --ink:#0D1424;
  --ink-2:#465169;
  --ink-3:#77829A;
  --line:#D3DAE5;
  --accent:#2B55F0;
  --accent-soft:rgba(43,85,240,.14);
  --cash:#0B9A55;
  --cash-soft:rgba(11,154,85,.14);
  --wait:#D9770F;
  --wait-soft:rgba(217,119,15,.15);
  --alert:#D33A2C;
  --alert-soft:rgba(211,58,44,.12);
  --idle:#9AA3B5;
  --shadow:0 1px 0 rgba(13,20,36,.04),0 10px 26px -14px rgba(13,20,36,.22);
  --ui:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C16;--floor:#0A111E;--grid:rgba(110,140,255,.07);--surface:#0F1829;--surface-2:#0C1423;
  --ink:#E6EBF5;--ink-2:#A5AFC4;--ink-3:#6F7A92;--line:#213049;--accent:#6E8DFF;--accent-soft:rgba(110,141,255,.18);
  --cash:#34C784;--cash-soft:rgba(52,199,132,.16);--wait:#F0A04A;--wait-soft:rgba(240,160,74,.16);--alert:#F2675B;--alert-soft:rgba(242,103,91,.16);--idle:#5A657E;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C16;--floor:#0A111E;--grid:rgba(110,140,255,.07);--surface:#0F1829;--surface-2:#0C1423;
  --ink:#E6EBF5;--ink-2:#A5AFC4;--ink-3:#6F7A92;--line:#213049;--accent:#6E8DFF;--accent-soft:rgba(110,141,255,.18);
  --cash:#34C784;--cash-soft:rgba(52,199,132,.16);--wait:#F0A04A;--wait-soft:rgba(240,160,74,.16);--alert:#F2675B;--alert-soft:rgba(242,103,91,.16);--idle:#5A657E;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,2.6vw,32px);padding-block:0 40px}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:14px;margin-inline:calc(-1*clamp(16px,2.6vw,32px));padding-inline:clamp(16px,2.6vw,32px);
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.mark svg{width:20px;height:20px}
.brand-name{font-weight:700;letter-spacing:-.01em;font-size:15px}
.brand-sub{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.switch{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;position:relative}
.switch button{border:0;background:transparent;padding:7px 18px;border-radius:999px;font-weight:500;color:var(--ink-2);cursor:pointer;position:relative;z-index:1;transition:color .25s}
.switch button[aria-selected="true"]{color:var(--bg)}
.switch .pill{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--ink);transition:left .35s cubic-bezier(.3,.7,.2,1),width .35s cubic-bezier(.3,.7,.2,1)}
.switch button:focus-visible,.btn:focus-visible,.room:focus-visible,.chip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top-right{display:flex;align-items:center;gap:10px}
.demo-badge{font-size:11.5px;color:var(--wait);background:var(--wait-soft);padding:5px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:500;cursor:pointer;transition:border-color .2s,transform .2s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:5px 9px;font-size:12px;border-radius:8px}
.unread{font-family:var(--mono);font-size:11px;background:var(--wait);color:#fff;border-radius:999px;padding:1px 7px}

/* ---------- en-tête de station ---------- */
.station-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 16px}
.st-title{font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.025em;margin:0;text-wrap:balance}
.st-sub{color:var(--ink-2);margin-top:2px}
.st-meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap}
.tag b{font-family:var(--mono);font-weight:500;color:var(--ink)}

/* ---------- plan de la station ---------- */
.plan{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.22fr) minmax(0,1fr);
  grid-template-areas:"a b c" "d core e" "f g h";gap:46px 52px;padding:30px;border-radius:24px;border:1px solid var(--line);
  background:
    radial-gradient(ellipse 40% 36% at 50% 50%,var(--cash-soft),transparent 70%),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    var(--floor)}
.conduits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.conduits .base{stroke:var(--line);stroke-width:6;stroke-linecap:round}
.conduits .flow{stroke-width:2;stroke-linecap:round;stroke-dasharray:3 9;animation:flow 1.1s linear infinite}
.conduits .flow[data-s="run"],.conduits .flow[data-s="online"]{stroke:var(--accent)}
.conduits .flow[data-s="wait"]{stroke:var(--wait)}
.conduits .flow[data-s="ok"]{stroke:var(--cash);animation-duration:2.4s}
.conduits .flow[data-s="idle"],.conduits .flow[data-s="gate"]{stroke:var(--idle);animation:none;stroke-dasharray:2 7}
.conduits .port{fill:var(--surface);stroke:var(--line);stroke-width:2}
.conduits .packet{filter:drop-shadow(0 0 5px currentColor)}
@keyframes flow{to{stroke-dashoffset:-12}}

/* ---------- salles ---------- */
.room{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s ease,border-color .25s ease,box-shadow .25s}
.room:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.room::before,.room::after{content:"";position:absolute;width:10px;height:10px;border:1.5px solid var(--ink-3);opacity:.45}
.room::before{top:6px;left:6px;border-right:0;border-bottom:0;border-top-left-radius:3px}
.room::after{bottom:6px;right:6px;border-left:0;border-top:0;border-bottom-right-radius:3px}
.room.flash{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.room.enter{animation:roomIn .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*55ms)}
@keyframes roomIn{from{opacity:.35;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.room-head{display:flex;align-items:flex-start;gap:10px}
.ico{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.ico svg{width:17px;height:17px}
.room-title{min-width:0;flex:1}
.room-name{font-weight:600;letter-spacing:-.01em;font-size:14.5px;line-height:1.2}
.room-agent{font-size:12px;color:var(--ink-3)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.state[data-s="run"],.state[data-s="online"]{background:var(--accent-soft);color:var(--accent)}
.state[data-s="wait"]{background:var(--wait-soft);color:var(--wait)}
.state[data-s="ok"]{background:var(--cash-soft);color:var(--cash)}
.light{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.light[data-s="run"],.light[data-s="online"]{background:var(--accent);animation:pulse 1.8s ease-out infinite}
.light[data-s="wait"]{background:var(--wait);animation:pulseW 1.4s ease-out infinite}
.light[data-s="ok"]{background:var(--cash)}
.light[data-s="err"]{background:var(--alert)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pulseW{0%{box-shadow:0 0 0 0 var(--wait-soft)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.room-body{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.room-foot{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px;font-size:12.5px;color:var(--ink-2)}
.room-foot q{quotes:"« " " »";min-width:0}
.room-foot time{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}

.k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;align-items:baseline}
.mini li>span:first-child{color:var(--ink-2);min-width:0}
.mini li>span:last-child{white-space:nowrap}
.good{color:var(--cash)}.warn{color:var(--wait)}.bad{color:var(--alert)}
.bar{height:6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar.cash i{background:var(--cash)}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.gauge-top .v{font-size:13px;font-weight:600}
.bignum{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface-2)}
.dots i.on{background:var(--cash);border-color:var(--cash)}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.track div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 7px;min-width:0}
.track b{display:block;font-family:var(--mono);font-size:16px;font-weight:600}
.track span{font-size:10.5px;color:var(--ink-3);line-height:1.2;display:block}
.track .hot{border-color:var(--wait);background:var(--wait-soft)}
.track .won{border-color:var(--cash);background:var(--cash-soft)}
.item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 8px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);transition:opacity .35s,transform .35s}
.item.gone{opacity:0;transform:translateX(24px)}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.w{background:var(--wait-soft);color:var(--wait)}
.chip.c{background:var(--cash-soft);color:var(--cash)}
.chip.g{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.ok-btn,.no-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 8px;font-size:11.5px;cursor:pointer;font-weight:500}
.ok-btn:hover{border-color:var(--cash);color:var(--cash)}
.no-btn:hover{border-color:var(--alert);color:var(--alert)}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.verdict .needle{width:22px;height:22px}
.radar{width:100%;max-width:150px;aspect-ratio:1;margin:2px auto 0;display:block}
.radar .sweep{transform-origin:60px 60px;animation:spin 5.5s linear infinite}
.radar .ring{fill:none;stroke:var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
.cal{display:flex;flex-direction:column;gap:6px}
.cal div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:baseline;font-size:12.5px}
.cal time{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.cal span{min-width:0}
.cmp{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.cmp b{font-size:12px;color:var(--ink);font-weight:600}
.gate-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gate-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.gate-stats b{display:block;font-family:var(--mono);font-size:16px;font-weight:600}
.gate-stats span{font-size:11px;color:var(--ink-3)}
.enter-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);font-size:13px}
.enter-link svg{width:15px;height:15px;transition:transform .25s}
.room:hover .enter-link svg{transform:translateX(3px)}

/* ---------- noyau cash ---------- */
.core{grid-area:core;position:relative;z-index:2;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.core.pulse{animation:corePulse .7s ease-out}
@keyframes corePulse{0%{box-shadow:0 0 0 0 var(--cash-soft),var(--shadow)}60%{box-shadow:0 0 0 14px transparent,var(--shadow)}100%{box-shadow:var(--shadow)}}
.core-head{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;padding:14px 16px 0;flex-wrap:wrap}
.core-head .k{display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font-size:12px;padding:4px 10px;border-radius:999px;color:var(--ink-3);cursor:pointer;font-weight:500}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;flex:1}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;padding:10px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.ringwrap{position:relative;width:min(250px,72vw);aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:14}
.ring-fg{fill:none;stroke:var(--cash);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)}
.ticks{transform-origin:130px 130px;animation:spin 90s linear infinite}
.ticks line{stroke:var(--ink-3);opacity:.35}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.ring-center .k{margin-bottom:4px}
.cash-big{font-size:clamp(30px,3.4vw,40px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.cash-date{font-size:12px;color:var(--ink-3);margin-top:6px}
.core-line{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slide-title{align-self:stretch;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.slide-title .cash-big{font-size:clamp(26px,2.8vw,34px)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--mono);font-size:10px}
.chart .val{fill:var(--ink);font-size:11px;font-weight:600}
.chart .gridl{stroke:var(--line);stroke-dasharray:2 4}
.chart .axis{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);align-self:stretch}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.meter{align-self:stretch;display:flex;flex-direction:column;gap:6px}
.meter-bar{position:relative;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.meter-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--cash)}
.meter-bar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--wait);border-radius:2px}
.meter-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);gap:8px}
.core-nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:0 0 14px}
.core-nav .arr{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.core-nav .arr:disabled{opacity:.35;cursor:default}
.core-nav .arr svg{width:14px;height:14px}
.pager{display:flex;gap:6px}
.pager i{width:7px;height:7px;border-radius:999px;background:var(--line);transition:width .3s,background .3s}
.pager i.on{width:20px;background:var(--ink)}
.swipe-hint{font-size:11px;color:var(--ink-3)}

/* ---------- journal ---------- */
.journal{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.journal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.journal-head span{font-size:11.5px;color:var(--ink-3)}
.journal ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.journal li{display:grid;grid-template-columns:52px 96px minmax(0,1fr);gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.journal li:first-child{border-top:0}
.journal li.new{animation:logIn .5s ease-out}
@keyframes logIn{from{background:var(--accent-soft)}to{background:transparent}}
.journal time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.journal .who{font-size:11.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- panneau latéral (salle ouverte / messagerie) ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.32);z-index:40;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.35);animation:slideIn .35s cubic-bezier(.2,.7,.2,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slideIn{from{transform:translateX(30px);opacity:.4}}
.panel-head{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:18px;letter-spacing:-.015em}
.panel-head p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px}
.panel-body{flex:1;overflow-y:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rows>div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.rows>div:first-child{border-top:0}
.rows>div>span:first-child{color:var(--ink-2);min-width:0}
.rows>div>span:last-child{text-align:right}
.client{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.client-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.client-top b{font-size:14px}
.client-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;color:var(--ink-2)}
.client-grid b{display:block;color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12px}
.auto{display:flex;flex-direction:column;gap:10px}
.auto-row{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.auto-row .lbl{font-size:13px;font-weight:500}
.auto-row .lvl{display:flex;gap:4px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:11.5px;cursor:pointer;color:var(--ink-2)}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.auto-row small{color:var(--ink-3);font-size:11.5px}
.note{font-size:12px;color:var(--ink-3);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:9px 11px}

/* messagerie */
.chat{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;animation:logIn .5s}
.msg.h{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--ink);color:var(--bg);border-bottom-right-radius:4px;align-self:flex-end}
.msg time{display:block;font-family:var(--mono);font-size:10.5px;opacity:.6;margin-top:4px}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.composer input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 4px}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .plan{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"core core" "b g" "a c" "d e" "f h";gap:16px;padding:16px}
  .conduits{display:none}
}
@media (max-width:640px){
  .plan{grid-template-columns:minmax(0,1fr);grid-template-areas:"core" "b" "g" "a" "c" "d" "e" "f" "h";padding:12px;border-radius:18px}
  .top{gap:10px}
  .switch{order:3;width:100%}
  .switch button{flex:1;padding-inline:8px}
  .demo-badge{display:none}
  .journal li{grid-template-columns:44px minmax(0,1fr)}
  .journal .who{display:none}
  .core-head{padding:12px 12px 0}
  .slide{padding-inline:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function barsSVG(m){
  const W = 320, H = 170, top = 26, bot = 24, max = Math.max(...m.expected.map(e => e.eng + e.prob)) || 1;
  const sc = v => (H - top - bot) * v / max, bw = 58, gapX = (W - 3 * bw) / 4;
  const bars = m.expected.map((e, i) => {
    const x = gapX + i * (bw + gapX), he = sc(e.eng), hp = sc(e.prob), yE = H - bot - he, yP = yE - hp;
    return `${e.eng ? `<rect x="${x}" y="${yE}" width="${bw}" height="${he}" rx="5" fill="var(--cash)"/>` : ''}
      ${e.prob ? `<rect x="${x + .75}" y="${yP + .75}" width="${bw - 1.5}" height="${Math.max(hp - 1.5, 0)}" rx="5" fill="url(#hatch-${m.key})" stroke="var(--cash)" stroke-width="1.5"/>` : ''}
      <text class="val" x="${x + bw / 2}" y="${yP - 7}" text-anchor="middle">${esc(money(e.eng + e.prob, m.cur))}</text>
      <text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle">${esc(e.m)}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cash attendu sur les 3 prochains mois"><defs><pattern id="hatch-${m.key}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--cash)" opacity=".55"/></pattern></defs>
    <line class="axis" x1="0" x2="${W}" y1="${H - bot}" y2="${H - bot}"/>${bars}</svg>`;
}

function stepSVG(m){
  const W = 320, H = 150, L = 40, R = 12, T = 14, B = 22;
  const t0 = toDate(m.cumulStart).getTime() - 86400000 * .5, t1 = toDate(TODAY_EX).getTime() + 86400000 * .5;
  const vmax = m.steps.at(-1)[1], nice = niceMax(vmax * 1.12);
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0), y = v => H - B - (H - T - B) * v / nice;
  let d = `M${x(t0)} ${y(0)}`, prev = 0;
  m.steps.forEach(([ds, v]) => { const xx = x(toDate(ds).getTime()); d += ` L${xx.toFixed(1)} ${y(prev).toFixed(1)} L${xx.toFixed(1)} ${y(v).toFixed(1)}`; prev = v; });
  d += ` L${x(t1).toFixed(1)} ${y(prev).toFixed(1)}`;
  const area = d + ` L${x(t1).toFixed(1)} ${y(0)} Z`;
  const grid = [nice / 2, nice].map(v => `<line class="gridl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${esc(short(v, m.cur))}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cash cumulé depuis le début">${grid}
    <line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/><text x="${L - 6}" y="${y(0) + 3}" text-anchor="end">0</text>
    <path d="${area}" fill="var(--cash-soft)"/><path d="${d}" fill="none" stroke="var(--cash)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(t1)}" cy="${y(prev)}" r="4.5" fill="var(--cash)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H - 6}">${esc(dayShort(m.cumulStart))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">aujourd’hui</text></svg>`;
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k * p >= v) return k * p; return 10 * p; }
function short(v, cur){ const s = cur === 'USD' ? ' $' : ' €'; return v >= 1000 ? (v / 1000).toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' k' + s : Math.round(v) + s; }
function meterHTML(m){
  const ca = m.steps.at(-1)[1], th = m.thresholds, max = th.micro;
  return `<div class="meter"><div class="meter-l"><span>Chiffre d’affaires 2026 de la micro de Jay</span><span class="mono">${money(ca)}</span></div>

function countUp(el){
  if (!el) return;
  const v = +el.dataset.v, cur = el.dataset.cur;
  if (RM) { el.textContent = money(v, cur); return; }
  const t0 = performance.now(), dur = 1100;
  const tick = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = money(v * e, cur); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* ---------- conduits ---------- */
const wide = window.matchMedia('(min-width: 1081px)');
function edgePoint(cx, cy, hw, hh, dx, dy){
  const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return [cx + dx * t, cy + dy * t];
}
function drawConduits(){
  const svgEl = $('#conduits'), plan = $('#plan'), core = $('#core');
  if (!svgEl || !core) return;
  svgEl.innerHTML = '';
  for (const k in endpoints) delete endpoints[k];
  if (!wide.matches) return;
  const pr = plan.getBoundingClientRect(), cr = core.getBoundingClientRect();
  const ccx = cr.left - pr.left + cr.width / 2, ccy = cr.top - pr.top + cr.height / 2;
  svgEl.setAttribute('viewBox', `0 0 ${pr.width} ${pr.height}`);
  let out = '';
  plan.querySelectorAll('.room').forEach(el => {
    const r = el.getBoundingClientRect(), rx = r.left - pr.left + r.width / 2, ry = r.top - pr.top + r.height / 2;
    const dx = ccx - rx, dy = ccy - ry;
    const [x1, y1] = edgePoint(rx, ry, r.width / 2, r.height / 2, dx, dy);
    const [x2, y2] = edgePoint(ccx, ccy, cr.width / 2, cr.height / 2, -dx, -dy);
    const id = el.dataset.room, spec = ROOMS[station].find(x => x.id === id), s = spec.s;
    endpoints[id] = [x1, y1, x2, y2, s];
    out += `<line class="base" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="flow" data-s="${s}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><circle class="port" cx="${x1}" cy="${y1}" r="4"/><circle class="port" cx="${x2}" cy="${y2}" r="4"/>`;
  });
  svgEl.innerHTML = out;
}
function packet(roomId, color = 'var(--accent)'){
  const e = endpoints[roomId], svgEl = $('#conduits');
  const room = document.querySelector(`.room[data-room="${roomId}"]`);
  if (room) { room.classList.add('flash'); setTimeout(() => room.classList.remove('flash'), 900); }
  if (!e || !svgEl || RM) return;
  const NS = 'http://www.w3.org/2000/svg', c = document.createElementNS(NS, 'circle');
  c.setAttribute('r', '5'); c.setAttribute('class', 'packet'); c.style.fill = color; c.style.color = color;
  svgEl.appendChild(c);
  const [x1, y1, x2, y2] = e, t0 = performance.now(), dur = 1000;
  const step = t => { const p = Math.min(1, (t - t0) / dur), q = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    c.setAttribute('cx', x1 + (x2 - x1) * q); c.setAttribute('cy', y1 + (y2 - y1) * q);
    if (p < 1) requestAnimationFrame(step); else { c.remove(); const core = $('#core'); if (core) { core.classList.remove('pulse'); void core.offsetWidth; core.classList.add('pulse'); } } };
  requestAnimationFrame(step);
}

  const go = t.closest('[data-go]'); if (go) { goSlide(+go.dataset.go); return; }
  const st = t.closest('[data-step]'); if (st) { goSlide(slide + (+st.dataset.step)); return; }
  const lvl = t.closest('[data-lvl]'); if (lvl) { lvl.parentElement.querySelectorAll('.chip-btn').forEach(b => b.setAttribute('aria-pressed', b === lvl ? 'true' : 'false')); return; }
  const q = t.closest('[data-q]'); if (q) { sendChat(q.dataset.q); return; }
  if (t.closest('.x') || t === $('#scrim')) { closePanel(); return; }
  if (t.closest('#openChat')) { chatPanel(); return; }
  const room = t.closest('.room'); if (room) { roomPanel(room.dataset.room); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#panel').hidden) { closePanel(); return; }
  const room = e.target.closest && e.target.closest('.room');
  if (room && (e.key === 'Enter' || e.key === ' ') && e.target === room) { e.preventDefault(); roomPanel(room.dataset.room); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'composer') { e.preventDefault(); const i = $('#chatInput'); sendChat(i.value); i.value = ''; }
});
document.addEventListener('scroll', e => {
  if (e.target && e.target.id === 'slides') {
    const sl = e.target, i = Math.round(sl.scrollLeft / Math.max(1, sl.clientWidth));
    if (i !== slide) { slide = i; syncPager(); }
  }
}, true);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawConduits(); movePill(); const sl = $('#slides'); if (sl) sl.scrollLeft = slide * sl.clientWidth; }, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawConduits(); movePill(); });

/* ---------- horloges ---------- */
setInterval(() => {
  const head = $('#stationHead'); if (head) head.innerHTML = headHTML(station);
  document.querySelectorAll('[data-live="countdown"]').forEach(el => el.textContent = countdown());
}, 30000);

/* ---------- démarrage ---------- */
const start = (location.hash || '').replace('#', '');
render(['fr', 'qg', 'us'].includes(start) ? start : 'qg', {keepHash:true});
window.addEventListener('hashchange', () => { const k = location.hash.replace('#', ''); if (['fr', 'qg', 'us'].includes(k) && k !== station) render(k, {keepHash:true}); });
syncPager();
if (!RM) setInterval(simulate, 4200);
})();
</script>
